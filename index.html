<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carregamento Expedição Grilazer</title>
  <style>
    :root{
      --bg:#f4f6fa; --card:#ffffff; --text:#222; --muted:#6b7280;
      --primary:#2563eb; --border:#e5e7eb; --ok:#16a34a; --warn:#f59e0b; --danger:#ef4444;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
    .wrap{width:100%;max-width:980px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.06);padding:22px}
    h1{margin:0 0 14px 0;font-size:20px;text-align:center}
    label{display:block;font-weight:600;margin:12px 0 6px}
    input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);font-size:16px;outline:none}
    input::placeholder{color:#9ca3af}
    .hint{font-size:12px;color:var(--muted);margin-top:6px}
    .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
    button{appearance:none;border:0;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer}
    .primary{background:var(--primary);color:#fff}
    .ghost{background:transparent;border:1px solid var(--border)}
    .danger{background:var(--danger);color:#fff}
    .out{margin-top:18px;background:#f9fafb;border:1px solid var(--border);border-radius:12px;padding:14px;font-family:Consolas,Menlo,monospace}
    .k{color:#374151}.v{font-weight:700}
    .grid{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
    .chip{border:1px solid var(--border);background:#fff;padding:12px 10px;border-radius:12px;font-weight:700;text-align:center;cursor:pointer}
    .chip:hover{border-color:#cbd5e1}
    .chip.selected{background:#eef2ff;border-color:#c7d2fe}
    .success{margin-top:10px;color:var(--ok);font-weight:700;display:none}
    table{width:100%;border-collapse:collapse;margin-top:16px}
    th,td{border:1px solid var(--border);padding:10px;font-size:14px;text-align:left}
    th{background:#f3f4f6}
    .empty{font-size:14px;color:#6b7280;text-align:center;padding:16px}
    .status{margin-top:10px;font-size:13px;color:#111;background:#fff;border:1px solid var(--border);padding:8px 10px;border-radius:10px;white-space:pre-wrap}
    .mono{font-family:Consolas,Menlo,monospace}
    .warnBox{margin-top:10px;background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;padding:10px;border-radius:10px;font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Carregamento Expedição Grilazer</h1>

      <div class="status mono" id="status">Status: iniciando…</div>
      <div class="warnBox" id="tips" style="display:none"></div>

      <label for="codigo">Cole ou leia o código da NF-e</label>
      <input id="codigo" type="text" inputmode="numeric" autocomplete="off" placeholder="Ex.: 44 dígitos da chave da NF-e" />
      <div class="hint">Ao atingir 34+ dígitos, a leitura ocorre automaticamente. Pressione Enter para forçar leitura.</div>

      <div class="out" id="resultado" hidden>
        <div><span class="k">Concatenação 30º–34º:</span> <span class="v" id="concat"></span></div>
        <div><span class="k">Lido em:</span> <span class="v" id="timestamp"></span></div>
        <div><span class="k">UID:</span> <span class="v" id="who">—</span></div>
      </div>

      <div id="transportadorasWrap" hidden>
        <div class="hint" style="margin-top:10px">Selecione a transportadora clicando no botão:</div>
        <div class="grid" id="gridTransportadoras"></div>
        <div class="success" id="okMsg">Transportadora selecionada!</div>
      </div>

      <div class="row">
        <button class="primary" id="btnLer">Ler</button>
        <button class="ghost" id="btnSync">Sincronizar (listar)</button>
        <button class="danger" id="btnLimpar">Limpar tela</button>
      </div>

      <div class="row">
        <input id="buscaSeq" placeholder="Buscar pela nota (5 dígitos)" maxlength="5" style="flex:1" />
        <button class="ghost" id="btnBuscar" title="Buscar por 5 dígitos">Buscar</button>
      </div>

      <div id="registros"></div>
    </div>
  </div>

  <!-- SDKs Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    // ===== Config fixa do seu projeto =====
    const firebaseConfig = {
      apiKey: "AIzaSyBzCRqVlM2DkxI4vemxWcogkOTJc8DGkvg",
      authDomain: "carregamento-bed8d.firebaseapp.com",
      databaseURL: "https://carregamento-bed8d-default-rtdb.firebaseio.com",
      projectId: "carregamento-bed8d",
      storageBucket: "carregamento-bed8d.firebasestorage.app",
      messagingSenderId: "1078318711627",
      appId: "1:1078318711627:web:391ceb1afc50315030dece",
      measurementId: "G-11T29VHSEB"
    };

    const statusBox = document.getElementById('status');
    const tipsBox = document.getElementById('tips');
    function setTips(html){ tipsBox.innerHTML = html; tipsBox.style.display='block'; }

    function logStatus(msg){
      console.log('[APP]', msg);
      statusBox.textContent = 'Status: ' + msg;
    }

    let app=null, auth=null, db=null;

    async function iniciar(){
      try{
        if(!window.firebase || !firebase.initializeApp){
          setTips('⚠️ Não foi possível carregar o SDK do Firebase.\n• Verifique a internet.\n• Se estiver abrindo como arquivo (file://), prefira abrir em um servidor local:\n  - VS Code: extensão Live Server\n  - Windows/macOS/Linux: no terminal, execute:  python -m http.server 8080 e acesse http://localhost:8080');
          return logStatus('SDK não carregado');
        }

        logStatus('carregando Firebase…');
        app = firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        db   = firebase.database();
        logStatus('conectando (login anônimo)…');

        await auth.signInAnonymously();
        const user = auth.currentUser;
        if(!user){
          setTips('⚠️ Login anônimo não retornou usuário.\nNo Firebase Console → Authentication → Métodos de login → ative “Anônimo (Anonymous)”.');
          return logStatus('falha no login anônimo');
        }

        logStatus('conectado. UID=' + user.uid);
        document.getElementById('who').textContent = user.uid;
      }catch(e){
        const code = (e && e.code) || '';
        const msg  = (e && e.message) || String(e);
        if(code === 'auth/operation-not-allowed'){
          setTips('⚠️ O login anônimo está DESATIVADO.\nVá em Firebase Console → Authentication → Métodos de login → ative “Anônimo”.');
        }else if(code === 'auth/network-request-failed'){
          setTips('⚠️ Falha de rede.\n• Verifique a conexão.\n• Se estiver abrindo como file://, rode num servidor local (http://localhost).');
        }else{
          setTips('⚠️ Erro ao iniciar: ' + msg);
        }
        logStatus('erro ao iniciar (' + code + ')');
      }
    }

    // ===== App =====
    const LISTA = ['SUDOESTE','RODONAVES','TNT','EUCATUR / TRANSGOSS','SIM / MOBILI / TW','GAAM'];

    const codigo = document.getElementById('codigo');
    const resultado = document.getElementById('resultado');
    const concatSpan = document.getElementById('concat');
    const timestampSpan = document.getElementById('timestamp');
    const transportadorasWrap = document.getElementById('transportadorasWrap');
    const gridTransportadoras = document.getElementById('gridTransportadoras');
    const okMsg = document.getElementById('okMsg');
    const registrosDiv = document.getElementById('registros');
    const btnLer = document.getElementById('btnLer');
    const btnLimpar = document.getElementById('btnLimpar');
    const btnSync = document.getElementById('btnSync');
    const buscaSeq = document.getElementById('buscaSeq');
    const btnBuscar = document.getElementById('btnBuscar');

    function somenteDigitos(v){ return (v||'').toString().replace(/\D+/g,''); }

    function construirBotoes(){
      gridTransportadoras.innerHTML = '';
      LISTA.forEach((nome) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.textContent = nome;
        b.setAttribute('data-nome', nome);
        b.addEventListener('click', () => selecionarTransportadora(nome));
        b.addEventListener('keydown', (e)=>{
          if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); selecionarTransportadora(nome); }
        });
        gridTransportadoras.appendChild(b);
      });
    }

    function extrair(){
      const digits = somenteDigitos(codigo.value);
      if(digits.length < 34){
        alert('O código precisa ter ao menos 34 dígitos (a chave NF-e costuma ter 44).');
        resultado.hidden = true;
        transportadorasWrap.hidden = true;
        return;
      }
      const seq = digits.slice(29,34);
      const agora = new Date();
      const dataHora = agora.toLocaleString('pt-BR');

      concatSpan.textContent = seq;
      timestampSpan.textContent = dataHora;
      resultado.hidden = false;

      construirBotoes();
      transportadorasWrap.hidden = false;
      const firstBtn = gridTransportadoras.querySelector('.chip');
      if(firstBtn) firstBtn.focus();
      return seq;
    }

    async function selecionarTransportadora(nome){
      document.querySelectorAll('.chip.selected').forEach(el=>el.classList.remove('selected'));
      const btn = Array.from(document.querySelectorAll('.chip')).find(b => b.dataset.nome === nome);
      if(btn) btn.classList.add('selected');

      okMsg.style.display = 'block';
      okMsg.textContent = 'Transportadora selecionada: ' + nome;
      setTimeout(()=> okMsg.style.display='none', 1500);

      if(!db || !firebase.auth().currentUser){
        setTips('⚠️ Firebase não iniciado. Clique em atualizar a página.');
        return;
      }

      const seq = concatSpan.textContent.trim();
      const dataHora = timestampSpan.textContent.trim();
      try{
        const ref = db.ref('leituras').push();
        await ref.set({
          seq, dataHora, transportadora: nome,
          uid: firebase.auth().currentUser.uid || null,
          ts: firebase.database.ServerValue.TIMESTAMP
        });
        logStatus('registro salvo ✔');
      }catch(e){
        setTips('⚠️ Erro ao salvar no Firebase: ' + e);
      }
    }

    async function listar(){
      if(!db){ setTips('⚠️ Firebase não iniciado.'); return; }
      try{
        const snap = await db.ref('leituras').limitToLast(500).get();
        const val = snap.val();
        if(!val){ registrosDiv.innerHTML = '<div class="empty">Sem registros ainda.</div>'; return; }
        const linhas = Object.values(val).sort((a,b)=> (a.ts||0)-(b.ts||0));
        let html = '<table><thead><tr><th>Nota (5 dígitos)</th><th>Data/Hora</th><th>Transportadora</th><th>UID</th></tr></thead><tbody>';
        for(const r of linhas){
          html += `<tr><td>${r.seq||''}</td><td>${r.dataHora||''}</td><td>${r.transportadora||''}</td><td>${r.uid||''}</td></tr>`;
        }
        html += '</tbody></table>';
        registrosDiv.innerHTML = html;
      }catch(e){
        setTips('⚠️ Erro ao listar: ' + e);
      }
    }

    async function buscar(){
      if(!db){ setTips('⚠️ Firebase não iniciado.'); return; }
      const seq = (buscaSeq.value || '').trim();
      if(!seq || seq.length !== 5){ alert('Informe exatamente 5 dígitos.'); return; }
      try{
        const snap = await db.ref('leituras').orderByChild('seq').equalTo(seq).get();
        const val = snap.val();
        if(!val){ registrosDiv.innerHTML = '<div class="empty">Nenhum registro encontrado para a nota '+seq+'.</div>'; return; }
        const linhas = Object.values(val).sort((a,b)=> (a.ts||0)-(b.ts||0));
        let html = '<table><thead><tr><th>Nota (5 dígitos)</th><th>Data/Hora</th><th>Transportadora</th><th>UID</th></tr></thead><tbody>';
        for(const r of linhas){
          html += `<tr><td>${r.seq||''}</td><td>${r.dataHora||''}</td><td>${r.transportadora||''}</td><td>${r.uid||''}</td></tr>`;
        }
        html += '</tbody></table>';
        registrosDiv.innerHTML = html;
      }catch(e){
        const msg = (e && e.message) ? e.message : String(e||'');
        if(msg.includes('indexOn')){
          setTips('⚠️ Adicione o índice nas Regras do Realtime Database:\n\n{\n  \"rules\": {\n    \"leituras\": {\n      \".read\": \"auth != null\",\n      \".write\": \"auth != null\",\n      \".indexOn\": [\"seq\", \"ts\"]\n    }\n  }\n}');
          // Fallback cliente
          try{
            const snapAll = await db.ref('leituras').limitToLast(2000).get();
            const valAll = snapAll.val();
            if(!valAll){ registrosDiv.innerHTML = '<div class="empty">Sem registros para varrer.</div>'; return; }
            const todos = Object.values(valAll);
            const filtrados = todos.filter(r => (r && r.seq) === seq).sort((a,b)=> (a.ts||0)-(b.ts||0));
            if(!filtrados.length){ registrosDiv.innerHTML = '<div class="empty">Nenhum registro encontrado para a nota '+seq+' (fallback).</div>'; return; }
            let html = '<table><thead><tr><th>Nota (5 dígitos)</th><th>Data/Hora</th><th>Transportadora</th><th>UID</th></tr></thead><tbody>';
            for(const r of filtrados){
              html += `<tr><td>${r.seq||''}</td><td>${r.dataHora||''}</td><td>${r.transportadora||''}</td><td>${r.uid||''}</td></tr>`;
            }
            html += '</tbody></table>';
            registrosDiv.innerHTML = html;
          }catch(e2){
            setTips('⚠️ Erro na busca (fallback): ' + e2);
          }
        }else{
          setTips('⚠️ Erro na busca: ' + msg);
        }
      }
    }

    // Eventos
    document.getElementById('btnLer').addEventListener('click', extrair);
    document.getElementById('btnSync').addEventListener('click', listar);
    document.getElementById('btnLimpar').addEventListener('click', ()=>{
      codigo.value='';
      resultado.hidden = true;
      transportadorasWrap.hidden = true;
      registrosDiv.innerHTML = '';
      codigo.focus();
    });
    document.getElementById('btnBuscar').addEventListener('click', buscar);
    document.getElementById('buscaSeq').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); buscar(); }});
    codigo.addEventListener('input', ()=>{
      const digits = somenteDigitos(codigo.value);
      if(digits.length >= 34) extrair();
    });
    codigo.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); extrair(); } });

    // Boot
    window.addEventListener('load', iniciar);
  </script>
</body>
</html>
